# Configuration for CarRacing World Model Agent
# Uses GPT-2 style transformer for world modeling

fsq_vae:
  input_channels: 3
  input_height: 64
  input_width: 64
  encoder_channels: [32, 64, 128, 256, 512]
  encoder_strides: [2, 2, 2, 2, 2]
  fsq_levels: [8, 8, 8, 4]  # 2048 codes
  latent_dim: 128
  decoder_channels: [512, 256, 128, 64, 32]
  decoder_strides: [2, 2, 2, 2, 2]
  learning_rate: 0.001  # Deprecated, use optimizer.learning_rate
  beta: 1.0

  # Perceptual loss settings
  use_perceptual_loss: true
  perceptual_weight: 1.0
  mse_weight: 0.05

  # Anti-collapse settings
  entropy_weight: 0.1

  # Optimizer configuration
  optimizer:
    optimizer: adamw
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
    amsgrad: false
    use_scheduler: false
    scheduler: cosine
    warmup_epochs: 0
    min_lr: 1.0e-6
    grad_clip_norm: null

world_model:
  # Transformer architecture (GPT-2 based)
  hidden_size: 256  # Embedding dimension
  dropout: 0.1  # Dropout rate
  n_layers: 6  # Number of transformer layers
  n_heads: 8  # Number of attention heads
  num_layers: 6  # Alias for compatibility

  # Input/Output dimensions
  state_dim: 4  # Match fsq_levels length
  action_dim: 3
  fsq_levels: [8, 8, 8, 4]  # Must match fsq_vae - 2048 codes

  # Training parameters
  learning_rate: 0.0003  # Deprecated, use optimizer.learning_rate
  sequence_length: 64  # Longer sequences benefit transformers

  # Optimizer configuration
  optimizer:
    optimizer: adamw  # AdamW is standard for transformers
    learning_rate: 0.0003  # Lower learning rate for transformers
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.01  # Weight decay helps prevent overfitting
    amsgrad: false

    # Learning rate scheduler (recommended for transformers)
    use_scheduler: true
    scheduler: cosine
    warmup_epochs: 5  # Warmup helps transformer training stability
    min_lr: 1.0e-6

    # Gradient clipping (important for transformers)
    grad_clip_norm: 1.0

controller:
  hidden_sizes: [256, 256]
  activation: tanh
  state_dim: 4
  action_dim: 3
  learning_rate: 0.001

  optimizer:
    optimizer: adamw
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
    amsgrad: false
    use_scheduler: false
    scheduler: cosine
    warmup_epochs: 0
    min_lr: 1.0e-6
    grad_clip_norm: null

data:
  env_name: CarRacing-v3
  render_mode: null
  num_rollouts: 10000
  max_episode_length: 2000
  num_workers: -1  # Auto-detect CPUs (was 4)
  batch_size: 100  # Deprecated
  episodes_per_batch: 10  # Episodes per worker (higher = faster, more memory)
  frame_skip: 4
  frame_stack: 1
  data_dir: /workspace/data/rollouts/

training:
  device: cuda
  use_mixed_precision: true  # Enable fp16 for 50% memory reduction
  batch_size: 256  # Increased back to 256 now that leaks are fixed
  num_epochs: 1_000
  train_vae_epochs: 1_000
  train_world_model_epochs: 1_000
  train_controller_epochs: 1_000

  # Lightning training parameters - VAE
  steps_per_epoch: 500
  val_samples: 200
  val_split: 0.05
  early_stopping_patience: 10
  num_dataloader_workers: 0  # Sequential chunk loading uses 0

  # VAE dataset parameters (sequential loading with subsampling)
  vae_subsample_rate: 16  # Use every 10th frame for decorrelation
  vae_files_per_chunk: 5  # Load 5 files at a time (~500K images, ~6GB)

  # World Model dataset parameters (sequential loading with subsampling)
  world_model_subsample_rate: 4  # Use every 4th frame
  world_model_files_per_chunk: 1  # Load 1 file at a time (reduced for memory)
  world_model_sequence_length: 4  # Reduced from 64 due to autoregressive FSQ (16*5=80 tokens)

  # Lightning training parameters - World Model
  world_model_batch_size: 16  # Smaller due to sequences
  world_model_steps_per_epoch: 200
  world_model_val_samples: 200

  eval_every: 10
  save_every: 25
  log_every: 100
  checkpoint_dir: ./checkpoints

evaluation:
  # Episodes
  num_episodes: 10
  max_episode_length: 10_000

  # Modes
  eval_real: true
  eval_dream: false

  # Dream environment
  dream_initial_state: random  # 'random' or 'real'
  dream_temperature: 1.0

  # Video recording
  save_video: false
  video_fps: 30
  video_comparison: false

  # Visualization
  render_mode: null  # null, 'human', or 'rgb_array'

  # Output
  output_dir: ./evaluations
  save_metrics: true

  # Reproducibility
  seed: null
