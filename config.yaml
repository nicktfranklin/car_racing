fsq_vae:
  input_channels: 3
  input_height: 64
  input_width: 64
  encoder_channels: [32, 64, 128, 256]
  encoder_strides: [2, 2, 2, 2]
  fsq_levels: [8, 5, 5, 5]  # 1000 codes
  latent_dim: 32
  decoder_channels: [256, 128, 64, 32]
  decoder_strides: [2, 2, 2, 2]
  learning_rate: 0.001  # Deprecated, use optimizer.learning_rate
  beta: 1.0  # Commitment loss weight

  # Optimizer configuration
  optimizer:
    optimizer: adam  # adam, adamw, or sgd
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
    amsgrad: false
    momentum: 0.9  # For SGD
    nesterov: false  # For SGD

    # Learning rate scheduler
    use_scheduler: false
    scheduler: cosine  # cosine, step, exponential, reduce_on_plateau
    warmup_epochs: 0
    min_lr: 1.0e-6
    step_size: 30  # For step scheduler
    gamma: 0.1  # For step/exponential scheduler
    patience: 10  # For reduce_on_plateau
    factor: 0.5  # For reduce_on_plateau

    # Gradient clipping
    grad_clip_norm: null  # Set to a value like 1.0 to enable

world_model:
  hidden_size: 256
  num_layers: 1
  dropout: 0.0
  state_dim: 4
  action_dim: 3
  fsq_levels: [8, 5, 5, 5]  # Must match fsq_vae
  learning_rate: 0.001  # Deprecated, use optimizer.learning_rate
  sequence_length: 50

  # Optimizer configuration
  optimizer:
    optimizer: adam
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
    amsgrad: false
    momentum: 0.9
    nesterov: false
    use_scheduler: false
    scheduler: cosine
    warmup_epochs: 0
    min_lr: 1.0e-6
    step_size: 30
    gamma: 0.1
    patience: 10
    factor: 0.5
    grad_clip_norm: 1.0  # Enable gradient clipping for RNN training

controller:
  hidden_sizes: [256, 256]
  activation: tanh
  state_dim: 4
  action_dim: 3
  learning_rate: 0.001  # Deprecated, use optimizer.learning_rate

  # Optimizer configuration
  optimizer:
    optimizer: adam
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
    amsgrad: false
    momentum: 0.9
    nesterov: false
    use_scheduler: false
    scheduler: cosine
    warmup_epochs: 0
    min_lr: 1.0e-6
    step_size: 30
    gamma: 0.1
    patience: 10
    factor: 0.5
    grad_clip_norm: null

data:
  env_name: CarRacing-v3
  render_mode: null
  num_rollouts: 10000 
  max_episode_length: 2000  
  num_workers: 4
  batch_size: 100
  frame_skip: 4
  frame_stack: 1
  data_dir: ./data

training:
  device: mps
  batch_size: 256
  num_epochs: 100
  train_vae_epochs: 100
  train_world_model_epochs: 50
  train_controller_epochs: 100

  # Lightning training parameters - VAE
  steps_per_epoch: 100  # Number of batches per training epoch for VAE
  val_samples: 500  # Number of validation samples to use for VAE
  val_split: 0.05  # 5% of data for validation
  early_stopping_patience: 10  # Stop if no improvement for N epochs
  num_dataloader_workers: 2  # Parallel data loading workers (reduced to save RAM)
  subsample_rate: 4  # Use every Nth frame (4 = 25% of frames)

  # Lightning training parameters - World Model
  world_model_steps_per_epoch: 1000  # Number of batches per epoch for world model
  world_model_val_samples: 500  # Number of validation samples for world model

  eval_every: 10
  save_every: 25
  log_every: 100
  checkpoint_dir: ./checkpoints